---
name: Publish release

# Public PyPI path for spoke tags. Uploads the already-published wheel/sdist
# for that tag. Does not rebuild. Does not publish to any private index.
#
#   vX.Y.Z              → agilerl
#   agilerl-arena/vX.Y.Z → agilerl-arena
#
# Preferred trigger: workflow_dispatch from an existing tag ref (pairs with
# environment `pypi` required reviewers + tag deployment policy). Tag push
# does not publish; minting spoke tags from hub must not upload to PyPI.
#
# Auth:
#   fetch   — GitHub OIDC → read-only IAM role (repository secret
#             AWS_CODEARTIFACT_READ_ROLE_ARN). No long-lived AWS keys.
#   publish — PyPI Trusted Publishing (OIDC) via environment `pypi`.
#             No UV_PUBLISH_TOKEN. Fetch credentials do not leak into publish.

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing spoke tag to publish (e.g. v2.9.0 or agilerl-arena/v0.2.0). Empty = the ref that triggered the run.
                required: false
                default: ''

permissions:
    contents: read

jobs:
    fetch:
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            version: ${{ steps.tag.outputs.version }}
            dist_name: ${{ steps.tag.outputs.dist_name }}
            package: ${{ steps.tag.outputs.package }}
        steps:
            - name: Resolve tag
              id: tag
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if [[ -n "${INPUT_TAG}" ]]; then
                    TAG="${INPUT_TAG}"
                  else
                    TAG="${GITHUB_REF_NAME}"
                  fi
                  TAG="${TAG#refs/tags/}"
                  case "${TAG}" in
                    agilerl-arena/v*)
                      VER="${TAG#agilerl-arena/v}"
                      PKG=agilerl-arena
                      DIST=agilerl_arena
                      ;;
                    v*)
                      VER="${TAG#v}"
                      PKG=agilerl
                      DIST=agilerl
                      ;;
                    *)
                      echo "ref ${TAG} is not a v* or agilerl-arena/v* release tag" >&2
                      exit 1
                      ;;
                  esac
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${VER}" >> "$GITHUB_OUTPUT"
                  echo "package=${PKG}" >> "$GITHUB_OUTPUT"
                  echo "dist_name=${DIST}" >> "$GITHUB_OUTPUT"

            - name: Checkout fetch script
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Require read role
              env:
                  AWS_CODEARTIFACT_READ_ROLE_ARN: ${{ secrets.AWS_CODEARTIFACT_READ_ROLE_ARN }}
              run: |
                  set -euo pipefail
                  if [[ -z "${AWS_CODEARTIFACT_READ_ROLE_ARN:-}" ]]; then
                    echo "Set repository secret AWS_CODEARTIFACT_READ_ROLE_ARN to the read-only IAM role ARN." >&2
                    exit 1
                  fi

            - name: Configure AWS credentials (OIDC, read-only)
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ secrets.AWS_CODEARTIFACT_READ_ROLE_ARN }}
                  aws-region: us-east-1
                  audience: sts.amazonaws.com
                  role-session-name: agilerl-pypi-fetch
                  role-duration-seconds: 900
                  mask-aws-account-id: true
                  allowed-account-ids: '761296822462'

            - name: Fetch INTERNAL dist
              env:
                  VER: ${{ steps.tag.outputs.version }}
                  PKG: ${{ steps.tag.outputs.package }}
              run: |
                  set -euo pipefail
                  rm -rf dist
                  mkdir -p dist
                  python3 scripts/fetch_arena_internal_dist.py \
                    --package "${PKG}" \
                    --version "${VER}" \
                    --out-dir dist \
                    --domain agilerl-pypi \
                    --domain-owner 761296822462 \
                    --repository arena \
                    --region us-east-1

            - name: Upload dist
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: pypi-dist
                  path: dist/
                  if-no-files-found: error

    publish:
        needs: fetch
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: pypi-dist
                  path: dist

            # agilerl hard-depends on agilerl-arena; uploading the agilerl
            # wheel before its arena pin is resolvable on PyPI would break
            # `pip install agilerl` for everyone until arena lands. The order
            # in sync/README.md (arena first) is enforced here, not just prose.
            - name: Gate agilerl on a resolvable agilerl-arena pin
              if: needs.fetch.outputs.package == 'agilerl'
              env:
                  VER: ${{ needs.fetch.outputs.version }}
                  DIST: ${{ needs.fetch.outputs.dist_name }}
              run: |
                  set -euo pipefail
                  python3 -m pip install --quiet packaging
                  python3 - <<'PY'
                  import glob
                  import json
                  import os
                  import sys
                  import urllib.request
                  import zipfile

                  from packaging.requirements import Requirement
                  from packaging.utils import canonicalize_name
                  from packaging.version import InvalidVersion, Version

                  dist = os.environ["DIST"]
                  ver = os.environ["VER"]
                  wheels = glob.glob(f"dist/{dist}-{ver}-*.whl")
                  if not wheels:
                      sys.exit(f"no wheel found for {dist}=={ver} in dist/")
                  with zipfile.ZipFile(wheels[0]) as zf:
                      meta_name = next(
                          n for n in zf.namelist() if n.endswith(".dist-info/METADATA")
                      )
                      metadata = zf.read(meta_name).decode()
                  arena_reqs = [
                      Requirement(line.split(":", 1)[1].strip())
                      for line in metadata.splitlines()
                      if line.startswith("Requires-Dist:")
                  ]
                  arena_reqs = [
                      r for r in arena_reqs
                      if canonicalize_name(r.name) == "agilerl-arena" and r.marker is None
                  ]
                  if not arena_reqs:
                      print("wheel declares no unconditional agilerl-arena dependency; nothing to gate")
                      sys.exit(0)
                  spec = arena_reqs[0].specifier
                  with urllib.request.urlopen(
                      "https://pypi.org/pypi/agilerl-arena/json", timeout=30
                  ) as resp:
                      releases = json.load(resp)["releases"]
                  available = []
                  for version, files in releases.items():
                      if not files or all(f.get("yanked") for f in files):
                          continue
                      try:
                          available.append(Version(version))
                      except InvalidVersion:
                          continue
                  if not any(spec.contains(v) for v in available):
                      sys.exit(
                          f"agilerl=={ver} requires agilerl-arena{spec}, but PyPI has "
                          f"{sorted(map(str, available)) or 'no releases'}. Publish the "
                          "agilerl-arena tag first (see sync/README.md), then re-run."
                      )
                  print(f"agilerl-arena{spec} is resolvable on PyPI")
                  PY

            - name: Install uv
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

            - name: Publish to PyPI (OIDC)
              env:
                  TAG: ${{ needs.fetch.outputs.tag }}
                  VER: ${{ needs.fetch.outputs.version }}
                  DIST: ${{ needs.fetch.outputs.dist_name }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  artifacts=(dist/${DIST}-${VER}*)
                  if [[ ${#artifacts[@]} -eq 0 ]]; then
                    echo "missing dist artifacts for ${DIST}==${VER}"; ls -la dist; exit 1
                  fi
                  echo "Publishing ${DIST}==${VER} from tag ${TAG} via Trusted Publishing"
                  # --check-url skips an artifact already on the index, so a re-run
                  # of a partly-failed release does not fail on what did land.
                  uv publish --trusted-publishing always --check-url https://pypi.org/simple "${artifacts[@]}"
